<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;background:transparent;color:#e8e8e8;font-family:-apple-system,Helvetica,Arial,sans-serif}
.wrap{display:flex;flex-direction:column;align-items:center;padding:12px 8px}
.city{font-size:14px;opacity:.7;letter-spacing:.08em;text-transform:uppercase}
.now{display:flex;align-items:center;gap:14px;margin:6px 0}
.icon{font-size:54px;line-height:1}.temp{font-size:56px;font-weight:300}
.desc{font-size:16px;opacity:.85}.meta{font-size:13px;opacity:.6;margin-top:2px}
.days{display:flex;gap:18px;margin-top:14px}.day{text-align:center;font-size:13px}
.day .i{font-size:24px;margin:2px 0}.day .hi{font-weight:600}.day .lo{opacity:.6;margin-left:4px}
.err{opacity:.6;font-size:14px;padding:20px}
</style></head><body><div class="wrap" id="w"><div class="err">Loading weather…</div></div>
<script>
var LAT=37.7749,LON=-122.4194,TZ='America/Los_Angeles',CITY='San Francisco';
var W={0:['☀️','Clear'],1:['🌤','Mostly clear'],2:['⛅','Partly cloudy'],3:['☁️','Overcast'],45:['🌫','Fog'],48:['🌫','Fog'],
51:['🌦','Light drizzle'],53:['🌦','Drizzle'],55:['🌧','Heavy drizzle'],61:['🌧','Light rain'],63:['🌧','Rain'],65:['🌧','Heavy rain'],
66:['🌧','Freezing rain'],67:['🌧','Freezing rain'],71:['🌨','Light snow'],73:['🌨','Snow'],75:['❄️','Heavy snow'],77:['🌨','Snow grains'],
80:['🌦','Showers'],81:['🌧','Showers'],82:['⛈','Heavy showers'],85:['🌨','Snow showers'],86:['❄️','Snow showers'],95:['⛈','Thunderstorm'],96:['⛈','Thunderstorm'],99:['⛈','Thunderstorm']};
function wx(c){return W[c]||['🌡','—']}
function load(){
 var u='https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+'&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min,weather_code&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone='+encodeURIComponent(TZ)+'&forecast_days=4';
 fetch(u).then(function(r){return r.json()}).then(function(d){
  var c=d.current,x=wx(c.weather_code),h='';
  h+='<div class="city">'+CITY+'</div><div class="now"><div class="icon">'+x[0]+'</div><div><div class="temp">'+Math.round(c.temperature_2m)+'°</div></div></div>';
  h+='<div class="desc">'+x[1]+'</div><div class="meta">Wind '+Math.round(c.wind_speed_10m)+' mph · Humidity '+c.relative_humidity_2m+'%</div><div class="days">';
  for(var i=1;i<d.daily.time.length;i++){var dt=new Date(d.daily.time[i]+'T12:00:00'),y=wx(d.daily.weather_code[i]);
   h+='<div class="day"><div>'+dt.toLocaleDateString('en-US',{weekday:'short'})+'</div><div class="i">'+y[0]+'</div><span class="hi">'+Math.round(d.daily.temperature_2m_max[i])+'°</span><span class="lo">'+Math.round(d.daily.temperature_2m_min[i])+'°</span></div>'}
  document.getElementById('w').innerHTML=h+'</div>';
 }).catch(function(){document.getElementById('w').innerHTML='<div class="err">Weather unavailable</div>'});
}
load();setInterval(load,15*60*1000);
</script></body></html>
