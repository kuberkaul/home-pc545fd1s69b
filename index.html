<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Home</title>
<style>
:root{--fg:#f2f4f8;--muted:rgba(242,244,248,.62);--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.14);--chip:rgba(255,255,255,.16);--chipline:rgba(255,255,255,.7);--col:rgba(255,255,255,.04);--coltoday:rgba(255,255,255,.12);--shadow:rgba(0,0,0,.28)}
body.light{--fg:#172033;--muted:rgba(23,32,51,.6);--glass:rgba(255,255,255,.55);--line:rgba(23,32,51,.1);--chip:rgba(23,32,51,.08);--chipline:rgba(23,32,51,.55);--col:rgba(255,255,255,.28);--coltoday:rgba(255,255,255,.6);--shadow:rgba(40,60,90,.18)}
body{transition:color .6s}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0f1e;color:var(--fg);font-family:-apple-system,"SF Pro Display",Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* sky */
#sky{position:fixed;inset:0;background:linear-gradient(160deg,var(--c1) 0%,var(--c2) 55%,var(--c3) 100%);transition:background 8s linear;z-index:0}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;transition:opacity .8s;mix-blend-mode:screen;z-index:0;will-change:transform}
#o1{width:48vw;height:48vw;left:-12vw;top:-10vw;background:var(--o1);animation:drift1 38s ease-in-out infinite alternate}
#o2{width:40vw;height:40vw;right:-10vw;bottom:-14vw;background:var(--o2);animation:drift2 46s ease-in-out infinite alternate}
#o3{width:28vw;height:28vw;left:35vw;bottom:-8vw;background:var(--o3);animation:drift3 54s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vw,14vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-16vw,-18vh) scale(1.1)}}
@keyframes drift3{to{transform:translate(12vw,-22vh) scale(.9)}}
#stars{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity 6s}
body.light #stars{display:none}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle var(--d) ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.15;transform:scale(.8)}to{opacity:.95;transform:scale(1.2)}}
/* layout */
#app{position:relative;z-index:1;height:100%;height:-webkit-fill-available;display:grid;grid-template-columns:minmax(0,46fr) minmax(0,54fr);grid-template-rows:minmax(0,1fr);gap:2.4vw;padding:2.6vh 3vw;padding-top:calc(2.6vh + env(safe-area-inset-top));padding-bottom:calc(2vh + env(safe-area-inset-bottom));padding-left:calc(3vw + env(safe-area-inset-left));padding-right:calc(3vw + env(safe-area-inset-right));overflow:hidden}
body{height:-webkit-fill-available}
/* Home Screen web app: iPadOS draws its status bar over the page and reports 0 inset in landscape */
body.standalone #app{padding-top:calc(2.6vh + max(env(safe-area-inset-top), 28px))}
@media (orientation:portrait){body.standalone #app{padding-top:calc(2vh + max(env(safe-area-inset-top), 28px))}}
.col{display:flex;flex-direction:column;gap:2vh;min-height:0;overflow:hidden}
#clock,#tiles{flex:0 0 auto}
#app>.col:last-child{padding-bottom:5.4vw}
.card{background:var(--glass);border:1px solid var(--line);border-radius:2.2vw;-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);box-shadow:0 1.2vh 4vh var(--shadow);transition:background .6s,border-color .6s,box-shadow .6s;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.card:nth-child(2){animation-delay:.12s}.card:nth-child(3){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(3vh)}to{opacity:1;transform:none}}
/* clock */
#clock{padding:1.6vh 2.4vw 1.5vh}
.greet{font-size:1.5vw;color:var(--muted);letter-spacing:.02em}
.time{font-size:6.4vw;font-weight:200;letter-spacing:-.04em;line-height:1;margin:.6vh 0 0;font-variant-numeric:tabular-nums;display:flex;align-items:flex-end}
.time .side{display:flex;flex-direction:column;justify-content:flex-end;margin-left:1.1vw;padding-bottom:.7vw;letter-spacing:0;font-weight:400}
.time .ss{font-size:1.9vw;color:var(--fg);opacity:.85;line-height:1}
.time .ampm{font-size:1.3vw;color:var(--muted);margin-top:.5vh;line-height:1}
.time .colon{transition:opacity .35s}
.date{font-size:1.45vw;color:var(--muted);margin-top:.4vh}
/* weather */
#wx{padding:2vh 2.4vw;flex:1 1 0;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.wxin{--wxs:1;font-size:calc(1.25vw * var(--wxs));display:flex;flex-direction:column}
.wx-now{display:flex;align-items:center;gap:2em}.wx-now>div:last-child{min-width:0}
.wx-icon{font-size:7em;line-height:1;filter:drop-shadow(0 .6vh 1.6vh rgba(0,0,0,.35));animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-.8vh) rotate(-3deg)}}
.wx-temp{font-size:7.5em;font-weight:200;letter-spacing:-.04em;line-height:1}
.wx-desc{font-size:2em;margin-top:.3em}.wx-meta{font-size:1.6em;color:var(--muted);margin-top:.2em}
.wx-days{display:flex;justify-content:space-between;margin-top:1.6em;padding-top:1.3em;border-top:1px solid var(--line)}
.day{text-align:center;font-size:1.65em;color:var(--muted)}.day .i{font-size:1.9em;margin:.2em 0}.day .hi{color:var(--fg);font-weight:600}.day .lo{margin-left:.3em}
/* bart */
#bart{padding:1.9vh 2.4vw 1.7vh;flex:0 0 auto}
#bart .bh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.8vh}
#bart .bh b{font-size:1.75vw;font-weight:600}#bart .bh span{font-size:1.2vw;color:var(--muted)}
#bart .dirs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2vw}
#bart .dir{min-width:0}
#bart .dir h4{margin:0 0 .7vh;font-size:1.15vw;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#bart .row{display:flex;align-items:center;gap:.6vw;font-size:1.45vw;line-height:1.35;padding:.35vh 0}
#bart .row i{flex:0 0 .85vw;height:.85vw;border-radius:50%;background:var(--lc)}
#bart .row .dest{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bart .row .mins{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
#bart .row .mins b{color:var(--fg);font-weight:600}
#bart .none{font-size:1.1vw;color:var(--muted)}
@media (orientation:portrait){#bart{grid-column:1/-1}#bart .bh b{font-size:2.2vw}#bart .bh span{font-size:1.6vw}#bart .dir h4{font-size:1.5vw}#bart .row{font-size:1.8vw}#bart .row i{flex-basis:1vw;height:1vw}#bart .none{font-size:1.6vw}}
/* tiles */
#tiles{display:grid;grid-template-columns:1fr 1fr;gap:2vh}
.tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:.3vh;padding:1.5vh 1.8vw;min-height:7.5vh;border-radius:2.2vw;color:#fff;text-decoration:none;overflow:hidden;border:1px solid rgba(255,255,255,.18);box-shadow:0 1.2vh 3vh rgba(0,0,0,.3);transition:transform .25s,box-shadow .25s;animation:rise .9s .36s cubic-bezier(.2,.8,.2,1) both}
.tile:active{transform:scale(.96)}
.tile::before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 45%);animation:sheen 9s linear infinite}
@keyframes sheen{to{transform:rotate(360deg)}}
.tile svg{width:3.2vw;height:3.2vw;fill:#fff;filter:drop-shadow(0 .4vh 1vh rgba(0,0,0,.35))}
.tile .t{font-size:1.65vw;font-weight:600;letter-spacing:.01em}.tile .s{font-size:1.1vw;opacity:.8}
#yt{background:linear-gradient(135deg,#ff3d3d,#b3001b)}#ym{background:linear-gradient(135deg,#ff6a3d,#8e1a3a)}
/* calendar */
#cal{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
#cal .hd{display:flex;justify-content:space-between;align-items:baseline;padding:2vh 2.4vw 1.2vh}
#cal .hd b{font-size:2vw;font-weight:600}#cal .hd span{font-size:1.4vw;color:var(--muted)}
#days{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.6vw;padding:0 1.4vw 1.6vh}
.dcol{display:flex;flex-direction:column;min-height:0;border-radius:1.2vw;padding:.8vh .5vw;background:var(--col)}
.dcol.today{background:var(--coltoday);box-shadow:inset 0 0 0 1px var(--line)}
.dcol .dn{font-size:1.25vw;color:var(--muted);text-align:center;letter-spacing:.08em;text-transform:uppercase}
.dcol .dd{font-size:2.6vw;font-weight:300;text-align:center;line-height:1.15;margin-bottom:.8vh}
.dcol.today .dd{font-weight:600}
.evs{display:flex;flex-direction:column;gap:.5vh;min-height:0;overflow:hidden}
.ev{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s,background .2s;background:var(--chip);border-left:.3vw solid var(--c,var(--chipline));border-radius:.6vw;padding:.5vh .5vw;font-size:1.15vw;line-height:1.25;overflow:hidden}
.ev .et{display:block;font-size:.95vw;color:var(--muted);font-variant-numeric:tabular-nums}
.ev .es{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500;word-break:break-word}
.ev.allday{background:var(--chip)}
.ev.now{box-shadow:inset 0 0 0 1px var(--c,var(--chipline))}
.ev:active{transform:scale(.95)}
.more{font-size:1vw;color:var(--muted);text-align:center;margin-top:.3vh;cursor:pointer;padding:.4vh 0}
/* event sheet */
#sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(5,8,20,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s}
#sheet.open{opacity:1;pointer-events:auto}
#sheet .box{width:min(560px,82vw);max-height:78vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:26px 28px;color:var(--fg);-webkit-backdrop-filter:blur(30px) saturate(150%);backdrop-filter:blur(30px) saturate(150%);box-shadow:0 20px 60px rgba(0,0,0,.35);transform:translateY(20px) scale(.97);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
body:not(.light) #sheet .box{background:rgba(20,28,52,.82)}
body.light #sheet .box{background:rgba(255,255,255,.9)}
#sheet.open .box{transform:none}
#sheet h2{margin:0 0 6px;font-size:26px;font-weight:600;line-height:1.2}
#sheet .when{font-size:17px;color:var(--muted)}
#sheet .row{display:flex;gap:10px;margin-top:16px;font-size:16px;line-height:1.4}
#sheet .row b{flex:0 0 22px;text-align:center;opacity:.75;font-weight:400}
#sheet .notes{white-space:pre-wrap;word-break:break-word}
#sheet .notes a{color:inherit}
#sheet .list .item{padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
#sheet .list .item:first-child{border-top:0}
#sheet .list .item .when{font-size:14px}
#sheet .list .item .t{font-size:18px;font-weight:500}
#sheet .close{display:block;margin:22px auto 0;padding:10px 26px;border-radius:30px;border:0;background:var(--fg);color:var(--bgc,#0a0f1e);font:inherit;font-size:16px;font-weight:600;cursor:pointer}
body.light #sheet .close{color:#fff}
.empty{font-size:1vw;color:var(--muted);text-align:center;margin-top:1vh;opacity:.6}
#cal .hd .legend{display:flex;gap:1.2vw;font-size:1.1vw;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
#cal .hd .legend i{display:inline-block;width:.8vw;height:.8vw;border-radius:50%;margin-right:.4vw;vertical-align:middle;background:var(--c)}
@media (orientation:portrait){#cal .hd .legend{font-size:1.6vw}#cal .hd .legend i{width:1.2vw;height:1.2vw}}
#sheet .who{display:inline-block;font-size:14px;padding:3px 10px;border-radius:12px;margin-bottom:10px;color:#fff;background:var(--c,#888)}
/* portrait: stack everything */
@media (orientation:portrait){
 #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:2vh;padding:2vh 4vw;padding-top:calc(2vh + env(safe-area-inset-top));padding-bottom:calc(1vh + 5.6vw + env(safe-area-inset-bottom))}
 .col:first-child{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:2vh}
 #clock{grid-column:1}#wx{grid-column:2;grid-row:1}#tiles,#bart{grid-column:1/-1}
 .time{font-size:8.4vw}.greet,.date{font-size:2.2vw}.time .ss{font-size:2.6vw}.time .ampm{font-size:1.9vw}
 #app>.col:last-child{padding-bottom:0}
 .wxin{font-size:calc(1.6vw * var(--wxs))}
 .tile{min-height:11vh}.tile .t{font-size:2.8vw}.tile .s{font-size:1.8vw}.tile svg{width:5.5vw;height:5.5vw}
 #cal .hd b{font-size:2.8vw}#cal .hd span{font-size:1.9vw}
 .dcol .dn{font-size:1.7vw}.dcol .dd{font-size:3.6vw}.ev{font-size:1.65vw}.ev .et{font-size:1.35vw}.more,.empty{font-size:1.5vw}
}
.dim #app{filter:brightness(.72)}
body.light .orb{opacity:.7;mix-blend-mode:normal}
/* mode toggle */
#mode{position:fixed;right:calc(3vw + env(safe-area-inset-right));bottom:calc(1.4vh + env(safe-area-inset-bottom));z-index:5;display:flex;gap:.2vw;padding:.3vw;border-radius:3vw;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);opacity:.55;transition:opacity .3s}
#mode:hover,#mode:active{opacity:1}
#mode button{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--fg);font:inherit;font-size:1.1vw;padding:.5vw 1vw;border-radius:3vw;opacity:.6;cursor:pointer}
#mode button.on{background:var(--fg);color:#fff;opacity:1}
body.light #mode button.on{color:#fff}
body:not(.light) #mode button.on{color:#0a0f1e}
@media (orientation:portrait){#mode{right:calc(4vw + env(safe-area-inset-right))}#mode button{font-size:1.6vw;padding:.8vw 1.5vw}}
</style>
</head>

<script src="./vendor/ical.min.js"></script>
<script>
// ---- settings ----
var CAL_INDEX='./calendars/index.json'; // feeds synced every 20 min by .github/workflows/sync-calendar.yml from the CAL_FEEDS secret
var MAX_EVENTS=5; // per day before "+N more"
var TZ='America/Los_Angeles', LAT=37.7749, LON=-122.4194;
var DIM_FROM=22, DIM_TO=6; // dim screen between these hours

// ---- calendar (ICS file in this repo, rendered as a 7-day view) ----
function ymd(d){return fmt(d,{year:'numeric',month:'2-digit',day:'2-digit'})} // local date key in TZ
function dayStart(d){var p=ymd(d).split('/');return new Date(p[2]+'-'+p[0]+'-'+p[1]+'T00:00:00')}
function esc(t){return String(t).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
var EVS=[],DAYS=[];
function renderCal(events){
 var now=new Date(),days=[],i,h=''; EVS=[];DAYS=[];
 for(i=0;i<7;i++){var d=new Date(now);d.setDate(now.getDate()+i);days.push({key:ymd(d),date:d,evs:[]})}
 events.forEach(function(e){days.forEach(function(d){
  if(e.allDay){ if(e.dayKeys.indexOf(d.key)>=0) d.evs.push(e) }
  else if(ymd(e.start)===d.key) d.evs.push(e) })});
 days.forEach(function(d,i){
  d.evs.sort(function(a,b){return (a.allDay?-1:a.start-0)-(b.allDay?-1:b.start-0)});
  h+='<div class="dcol'+(i===0?' today':'')+'"><div class="dn">'+(i===0?'Today':i===1?'Tmrw':fmt(d.date,{weekday:'short'}))+'</div><div class="dd">'+fmt(d.date,{day:'numeric'})+'</div><div class="evs">';
  if(!d.evs.length) h+='<div class="empty">—</div>';
  d.evs.slice(0,MAX_EVENTS).forEach(function(e){
   var live=!e.allDay&&e.start<=now&&e.end>now; EVS.push(e);
   h+='<div data-ev="'+(EVS.length-1)+'" class="ev'+(e.allDay?' allday':'')+(live?' now':'')+'" style="--c:'+e.color+'">'+(e.allDay?'':'<span class="et">'+fmt(e.start,{hour:'numeric',minute:'2-digit'}).replace(/:00/,'').replace(' ','').toLowerCase()+'</span>')+'<span class="es">'+esc(e.title)+'</span></div>'});
  if(d.evs.length>MAX_EVENTS){DAYS.push(d);h+='<div class="more" data-day="'+(DAYS.length-1)+'">+'+(d.evs.length-MAX_EVENTS)+' more</div>'}
  h+='</div></div>'});
 document.getElementById('days').innerHTML=h;
}
function parseFeed(txt,cal,from,to,out){
  var comp=new ICAL.Component(ICAL.parse(txt));
  comp.getAllSubcomponents('vevent').forEach(function(v){
   var ev=new ICAL.Event(v); if(!ev.startDate) return;
   function push(st,en){ var s=st.toJSDate(),e=en?en.toJSDate():new Date(s.getTime()+3600000);
    if(e<from||s>to) return;
    var allDay=st.isDate, keys=[];
    if(allDay){ var nd=en?Math.max(1,Math.round((Date.UTC(en.year,en.month-1,en.day)-Date.UTC(st.year,st.month-1,st.day))/86400000)):1;
     for(var k=0;k<nd;k++){var u=new Date(Date.UTC(st.year,st.month-1,st.day+k));keys.push(('0'+(u.getUTCMonth()+1)).slice(-2)+'/'+('0'+u.getUTCDate()).slice(-2)+'/'+u.getUTCFullYear())}}
    out.push({title:ev.summary||'(untitled)',start:s,end:e,allDay:allDay,dayKeys:keys,loc:ev.location||'',notes:ev.description||'',cal:cal.name,color:cal.color}) }
   if(ev.isRecurring()){ var it=ev.iterator(),n,c=0; while((n=it.next())&&c++<2000){ var d=n.toJSDate(); if(d>to) break; if(d<from&&!ev.duration) continue; var occ=ev.getOccurrenceDetails(n); push(occ.startDate,occ.endDate) } }
   else push(ev.startDate,ev.endDate);
  });
}
function loadCal(){
 var from=new Date();from.setDate(from.getDate()-1);var to=new Date();to.setDate(to.getDate()+8);
 fetch(CAL_INDEX+'?t='+Date.now()).then(function(r){return r.json()}).then(function(cals){
  var seen={},uniq=cals.filter(function(c){if(seen[c.name])return false;seen[c.name]=1;return true});
  document.getElementById('legend').innerHTML=uniq.length>1?uniq.map(function(c){return '<span style="--c:'+c.color+'"><i></i>'+esc(c.name)+'</span>'}).join(''):'';
  return Promise.all(cals.map(function(c){return fetch('./calendars/'+c.file+'?t='+Date.now()).then(function(r){return r.text()}).then(function(t){return {cal:c,txt:t}}).catch(function(){return null})}))
 }).then(function(feeds){
  var out=[]; feeds.forEach(function(f){ if(!f) return; try{parseFeed(f.txt,f.cal,from,to,out)}catch(e){console.warn('bad feed',f.cal.name,e)} });
  renderCal(out);
 }).catch(function(e){document.getElementById('days').innerHTML='<div class="empty" style="grid-column:1/-1">Calendar unavailable</div>'});
}
loadCal();setInterval(loadCal,10*60*1000);
// ---- event details sheet ----
function linkify(t){return esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1">$1</a>')}
function whenText(e){
 if(e.allDay){var n=e.dayKeys.length;return 'All day'+(n>1?' · '+n+' days':'')}
 var same=ymd(e.start)===ymd(e.end), t=function(d){return fmt(d,{hour:'numeric',minute:'2-digit'})};
 return fmt(e.start,{weekday:'long',month:'short',day:'numeric'})+' · '+t(e.start)+' – '+(same?t(e.end):fmt(e.end,{month:'short',day:'numeric'})+' '+t(e.end))}
function openSheet(html){document.getElementById('sheetbox').innerHTML=html+'<button class="close" data-close>Close</button>';document.getElementById('sheet').classList.add('open');clearTimeout(window._sheetT);window._sheetT=setTimeout(closeSheet,60000)}
function closeSheet(){document.getElementById('sheet').classList.remove('open')}
function showEvent(e){
 var dateLine=e.allDay?fmt(new Date(Date.UTC(+e.dayKeys[0].slice(6),+e.dayKeys[0].slice(0,2)-1,+e.dayKeys[0].slice(3,5),12)),{weekday:'long',month:'long',day:'numeric'}):'';
 var h=(e.cal?'<span class="who" style="--c:'+e.color+'">'+esc(e.cal)+'</span>':'')+'<h2>'+esc(e.title)+'</h2><div class="when">'+(dateLine?dateLine+' · ':'')+whenText(e)+'</div>';
 if(e.loc) h+='<div class="row"><b>📍</b><div>'+linkify(e.loc)+'</div></div>';
 if(e.notes) h+='<div class="row"><b>📝</b><div class="notes">'+linkify(e.notes)+'</div></div>';
 openSheet(h)}
document.getElementById('days').addEventListener('click',function(ev){
 var t=ev.target.closest('[data-ev]'); if(t){showEvent(EVS[+t.getAttribute('data-ev')]);return}
 var m=ev.target.closest('[data-day]'); if(m){var d=DAYS[+m.getAttribute('data-day')],h='<h2>'+fmt(d.date,{weekday:'long',month:'long',day:'numeric'})+'</h2><div class="list">';
  d.evs.forEach(function(e,i){h+='<div class="item" data-li="'+i+'"><div class="when">'+(e.allDay?'All day':fmt(e.start,{hour:'numeric',minute:'2-digit'}))+'</div><div class="t">'+esc(e.title)+'</div></div>'});
  openSheet(h+'</div>');window._listDay=d}});
document.getElementById('sheet').addEventListener('click',function(ev){
 var li=ev.target.closest('[data-li]'); if(li&&window._listDay){showEvent(window._listDay.evs[+li.getAttribute('data-li')]);return}
 if(ev.target.id==='sheet'||ev.target.hasAttribute('data-close')) closeSheet()});

// ---- clock, greeting, sky ----
var SKYS={dark:{ // hour -> [c1,c2,c3,o1,o2,o3]
 night:['#070b1a','#0d1530','#141b3d','#2b3a8f','#4b1f7a','#0e6b7a'],
 dawn:['#120f2e','#2e1a45','#4a2340','#7a3f6b','#3d2a73','#8a5a3a'],
 day:['#0b1630','#122447','#1a3260','#2a5aa8','#3a2f80','#13706e'],
 dusk:['#140f2c','#331a44','#512238','#8a3d5a','#47307f','#8a4a2e']},
 light:{
 night:['#c9d3ea','#dfe6f5','#eef2fb','#b9c8f2','#d9c4ee','#bfe3ea'],
 dawn:['#f5dfe6','#fbe9d6','#fff6ea','#ffc9b3','#e3c8f2','#ffe2a8'],
 day:['#dff0ff','#eef7ff','#ffffff','#bfe4ff','#fff0c2','#c8f5e3'],
 dusk:['#f6e3ea','#ffe8d8','#fff3e6','#ffcdb8','#e2caf4','#ffe0b0']}};
var SKY=SKYS.dark;
// ---- light / dark mode ----
var MODE=(location.search.match(/mode=(auto|light|dark)/)||[])[1]||localStorage.getItem('mode')||'auto';
function isLightNow(h){return h>=7&&h<19}
function applyMode(h){var light=MODE==='light'||(MODE==='auto'&&isLightNow(h));document.body.classList.toggle('light',light);SKY=light?SKYS.light:SKYS.dark;
 var b=document.querySelectorAll('#mode button');for(var i=0;i<b.length;i++)b[i].classList.toggle('on',b[i].getAttribute('data-m')===MODE)}
document.getElementById('mode').addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;MODE=t.getAttribute('data-m');localStorage.setItem('mode',MODE);lastHour=-1;tick()});
function mix(a,b,t){var p=function(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]},x=p(a),y=p(b);return'rgb('+x.map(function(v,i){return Math.round(v+(y[i]-v)*t)}).join(',')+')'}
function palette(h){ // smooth blend by hour (fractional)
 var k=[[0,'night'],[5,'night'],[7,'dawn'],[10,'day'],[16,'day'],[19,'dusk'],[21,'night'],[24,'night']];
 for(var i=0;i<k.length-1;i++) if(h>=k[i][0]&&h<k[i+1][0]){var t=(h-k[i][0])/(k[i+1][0]-k[i][0]);return SKY[k[i][1]].map(function(c,j){return mix(c,SKY[k[i+1][1]][j],t)})}
 return SKY.night}
function fmt(d,o){return new Intl.DateTimeFormat('en-US',Object.assign({timeZone:TZ},o)).format(d)}
var lastHour=-1;
function tick(){
 var d=new Date();
 var parts={};new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d).forEach(function(x){parts[x.type]=x.value});
 var h=+parts.hour%24, m=('0'+parts.minute).slice(-2), s=('0'+parts.second).slice(-2);
 var h12=((h+11)%12)+1;
 document.getElementById('hh').textContent=h12;document.getElementById('mm').textContent=m;
 document.getElementById('ss').textContent=s;
 document.getElementById('ampm').textContent=h<12?'AM':'PM';
 document.getElementById('dot').style.opacity=(d.getSeconds()%2)?.25:1;
 if(h!==lastHour){ lastHour=h; applyMode(h);
  document.getElementById('date').textContent=fmt(d,{weekday:'long',month:'long',day:'numeric'});
  document.getElementById('greet').textContent=h<5?'Good night':h<12?'Good morning':h<17?'Good afternoon':h<22?'Good evening':'Good night';
  var wkEnd=new Date(d);wkEnd.setDate(d.getDate()+6);
  document.getElementById('week').textContent=fmt(d,{month:'short',day:'numeric'})+' – '+fmt(wkEnd,{month:'short',day:'numeric'});
  var dim=(h>=DIM_FROM||h<DIM_TO);document.body.classList.toggle('dim',dim);
 }
 var p=palette(h+d.getMinutes()/60),r=document.documentElement.style;
 ['--c1','--c2','--c3','--o1','--o2','--o3'].forEach(function(v,i){r.setProperty(v,p[i])});
 document.getElementById('stars').style.opacity=(h>=20||h<6)?1:0;
}
(function stars(){var w=document.getElementById('stars'),f='';for(var i=0;i<90;i++)f+='<i style="left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;--d:'+(2+Math.random()*4)+'s;animation-delay:-'+Math.random()*5+'s;width:'+(1+Math.random()*2)+'px;height:'+(1+Math.random()*2)+'px"></i>';w.innerHTML=f})();
tick();setInterval(tick,1000);

// ---- BART departures (public feed, no key needed beyond BART's published one) ----
var BART_STATION='CIVC', BART_KEY='MW9S-E7SL-26DU-VV8V', LINE={RED:'#e8373d',YELLOW:'#f5c400',BLUE:'#2f8bff',GREEN:'#3cb54a',ORANGE:'#ff8a00',PURPLE:'#9b59ff',WHITE:'#dddddd'};
function bart(){
 fetch('https://api.bart.gov/api/etd.aspx?cmd=etd&orig='+BART_STATION+'&key='+BART_KEY+'&json=y').then(function(r){return r.json()}).then(function(j){
  var st=j.root.station[0],dirs={North:[],South:[]};
  (st.etd||[]).forEach(function(e){var est=e.estimate.filter(function(x){return x.minutes!=='0'||true}).slice(0,3);if(!est.length)return;
   var mins=est.map(function(x){return x.minutes==='Leaving'?0:+x.minutes}),dir=est[0].direction==='North'?'North':'South';
   dirs[dir].push({dest:e.destination,color:LINE[(est[0].color||'').toUpperCase()]||'#aaa',mins:mins,first:Math.min.apply(null,mins)})});
  function col(title,list){list.sort(function(a,b){return a.first-b.first});var h='<div class="dir"><h4>'+title+'</h4>';
   if(!list.length)h+='<div class="none">No trains</div>';
   list.slice(0,3).forEach(function(d){h+='<div class="row" style="--lc:'+d.color+'"><i></i><span class="dest">'+esc(d.dest)+'</span><span class="mins">'+d.mins.map(function(m,i){return (i===0?'<b>':'')+(m===0?'Now':m)+(i===0?'</b>':'')}).join(' · ')+'</span></div>'});
   return h+'</div>'}
  document.getElementById('bart-dirs').innerHTML=col('Northbound',dirs.North)+col('Southbound',dirs.South);
  document.getElementById('bart-upd').textContent='minutes · updated '+(j.root.time||'').replace(/:\d\d (AM|PM) \w+$/,' $1').toLowerCase();
  fitSoon();
 }).catch(function(){document.getElementById('bart-dirs').innerHTML='<div class="none">BART data unavailable</div>';document.getElementById('bart-upd').textContent=''});
}
bart();setInterval(bart,60*1000);

// ---- weather (Open-Meteo, no key) ----
var W={0:['☀️','Clear'],1:['🌤\ufe0f','Mostly clear'],2:['⛅','Partly cloudy'],3:['☁️','Overcast'],45:['🌫\ufe0f','Fog'],48:['🌫\ufe0f','Fog'],51:['🌦\ufe0f','Light drizzle'],53:['🌦\ufe0f','Drizzle'],55:['🌧\ufe0f','Heavy drizzle'],61:['🌧\ufe0f','Light rain'],63:['🌧\ufe0f','Rain'],65:['🌧\ufe0f','Heavy rain'],66:['🌧\ufe0f','Freezing rain'],67:['🌧\ufe0f','Freezing rain'],71:['🌨\ufe0f','Light snow'],73:['🌨\ufe0f','Snow'],75:['❄️','Heavy snow'],77:['🌨\ufe0f','Snow grains'],80:['🌦\ufe0f','Showers'],81:['🌧\ufe0f','Showers'],82:['⛈\ufe0f','Heavy showers'],85:['🌨\ufe0f','Snow showers'],86:['❄️','Snow showers'],95:['⛈\ufe0f','Thunderstorm'],96:['⛈\ufe0f','Thunderstorm'],99:['⛈\ufe0f','Thunderstorm']};
function wx(c,night){var x=W[c]||['🌡\ufe0f','—'];if(night&&(c===0||c===1))return['🌙',x[1]];return x}
function weather(){
 var u='https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+'&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m,is_day&daily=temperature_2m_max,temperature_2m_min,weather_code&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone='+encodeURIComponent(TZ)+'&forecast_days=5';
 fetch(u).then(function(r){return r.json()}).then(function(d){
  var c=d.current,x=wx(c.weather_code,!c.is_day),h='';
  h+='<div class="wx-now"><div class="wx-icon">'+x[0]+'</div><div><div class="wx-temp">'+Math.round(c.temperature_2m)+'°</div><div class="wx-desc">'+x[1]+' · San Francisco</div><div class="wx-meta">H '+Math.round(d.daily.temperature_2m_max[0])+'° L '+Math.round(d.daily.temperature_2m_min[0])+'° · '+Math.round(c.wind_speed_10m)+' mph · '+c.relative_humidity_2m+'%</div></div></div><div class="wx-days">';
  for(var i=1;i<d.daily.time.length;i++){var dt=new Date(d.daily.time[i]+'T12:00:00'),y=wx(d.daily.weather_code[i]);
   h+='<div class="day"><div>'+dt.toLocaleDateString('en-US',{weekday:'short'})+'</div><div class="i">'+y[0]+'</div><span class="hi">'+Math.round(d.daily.temperature_2m_max[i])+'°</span><span class="lo">'+Math.round(d.daily.temperature_2m_min[i])+'°</span></div>'}
  document.querySelector('#wx .wxin').innerHTML=h+'</div>'; fitWx(); setTimeout(fitWx,400); setTimeout(fitWx,2000);
 }).catch(function(){document.querySelector('#wx .wxin').innerHTML='<div class="wx-desc" style="color:var(--muted)">Weather unavailable</div>'});
}
// shrink the weather contents until they fit the card (runs after load, on resize and rotation)
function fitWx(){var card=document.getElementById('wx'),inner=card.querySelector('.wxin'),cs=getComputedStyle(card);
 var availH=card.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom),availW=card.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
 function fits(v){inner.style.setProperty('--wxs',v);return inner.scrollHeight<=availH&&inner.scrollWidth<=availW+1}
 var lo=.4,hi=1.8; for(var k=0;k<12;k++){var mid=(lo+hi)/2; if(fits(mid))lo=mid; else hi=mid}
 inner.style.setProperty('--wxs',(lo*.98).toFixed(3));
 if(window.FIT_DEBUG)console.log('fitWx t='+Math.round(performance.now())+' availH='+availH+' availW='+availW+' sc='+lo.toFixed(3));}
window.FIT_DEBUG=/debug/.test(location.search);var fitT;function fitSoon(){clearTimeout(fitT);fitT=setTimeout(fitWx,120)}
window.addEventListener('resize',fitSoon);window.addEventListener('orientationchange',fitSoon);
if(window.ResizeObserver){new ResizeObserver(fitSoon).observe(document.getElementById('wx'))}
weather();setInterval(weather,15*60*1000);
// self-update: compare the live page to the one we loaded; reload when it changes (and nightly at 4 AM)
var PAGE_SRC=null;
function fetchSelf(){return fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():null})}
fetchSelf().then(function(t){PAGE_SRC=t});
setInterval(function(){fetchSelf().then(function(t){if(t&&PAGE_SRC&&t!==PAGE_SRC&&!document.getElementById('sheet').classList.contains('open'))location.reload()})},10*60*1000);
setInterval(function(){var h=new Date().getHours();if(h===4)location.reload()},60*60*1000);
</script>
