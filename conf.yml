pageInfo:
  title: Home
  description: ""
appConfig:
  theme: material-dark
  layout: horizontal
  iconSize: large
  hideComponents:
    hideHeading: true
    hideNav: true
    hideSearch: true
    hideSettings: true
    hideFooter: true
  disableConfiguration: false
  statusCheck: false

sections:
  - name: Now
    displayData:
      sortBy: default
      rows: 1
      cols: 1
      collapsed: false
    widgets:
      - type: clock
        options:
          timeZone: America/Los_Angeles
          format: en-US
          hideDate: false
      - type: iframe
        options:
          url: ./weather.html
          frameHeight: 260

  - name: Schedule
    displayData:
      cols: 2
      rows: 2
      collapsed: false
    widgets:
      - type: iframe
        options:
          # Replace src with the Google Calendar embed URL for your sister's calendar
          url: https://calendar.google.com/calendar/embed?src=en.usa%23holiday%40group.v.calendar.google.com&mode=WEEK&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0&ctz=America%2FLos_Angeles
          frameHeight: 700

  - name: Media
    displayData:
      cols: 1
      collapsed: false
      itemSize: large
    items:
      - title: YouTube
        icon: hl-youtube
        url: https://m.youtube.com
        target: newtab
      - title: Spotify
        icon: hl-spotify
        url: spotify://
        target: newtab
